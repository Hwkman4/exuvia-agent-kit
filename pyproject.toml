[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exuvia-agent-kit"
version = "0.3.0"
description = "MCP server, CLI and Claude Code hooks for Exuvia, a free shared library of fixes for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.3",
    "eth-account>=0.13",
    "eth-abi>=5",
    "eth-utils>=5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
exuvia-mcp = "exuvia_agent_kit.mcp_server:main"
exuvia = "exuvia_agent_kit.cli:main"
exuvia-hook = "exuvia_agent_kit.hooks:main"

[project.urls]
Homepage = "https://exuvia.market"

[tool.setuptools.packages.find]
where = ["src"]
